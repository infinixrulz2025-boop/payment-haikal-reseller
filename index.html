<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAYMENT HAIKAL RESELLER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #222222;
            text-align: center;
            transition: opacity 0.4s ease;
            pointer-events: none;
            opacity: 1;
        }
        #intro-screen.hidden {
            opacity: 0;
        }
        #intro-screen .intro-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #111111;
            margin-bottom: 14px;
        }
        #intro-screen .intro-sub {
            font-size: 1.2rem;
            opacity: 0.6;
            letter-spacing: 6px;
            margin-bottom: 40px;
            color: #444444;
        }
        #intro-screen .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #333333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #intro-screen .loader-text {
            margin-top: 20px;
            font-size: 0.85rem;
            letter-spacing: 6px;
            opacity: 0.5;
            color: #666666;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #meteor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: block;
        }

        .payment-card {
            position: relative;
            z-index: 10;
            max-width: 680px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid #dddddd;
            border-radius: 48px;
            padding: 30px 28px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #333333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .logo-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.25);
        }
        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-title {
            font-size: 2.1rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: 2px;
            color: #222222;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #cccccc;
            word-break: break-word;
            cursor: default;
        }
        .store-title span {
            color: #333333;
        }
        .kotak-grid {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .kotak {
            background: rgba(245, 245, 245, 0.9);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 22px 20px 24px;
            border: 1px solid #dddddd;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            position: relative;
        }
        .kotak-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #222222;
            letter-spacing: 1px;
            font-size: 1.25rem;
            user-select: none;
            pointer-events: none;
        }
        .toggle-icon {
            margin-left: auto;
            font-size: 1.2rem;
            color: #888888;
            transition: transform 0.3s ease;
            user-select: none;
            pointer-events: none;
        }
        .kotak.open .toggle-icon {
            transform: rotate(180deg);
        }
        .kotak-content {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-top: 0;
        }
        .kotak.open .kotak-content {
            max-height: 600px;
            opacity: 1;
            margin-top: 16px;
        }
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .qr-wrapper img {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 24px;
            border: 2px solid #cccccc;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            background: #ffffff;
            padding: 6px;
            cursor: pointer;
        }
        .qr-hint {
            color: #666666;
            font-size: 0.85rem;
        }
        .account-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: #f0f0f0;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid #dddddd;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.05);
        }
        .account-number {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #111111;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            flex: 1;
        }
        .copy-btn {
            background: #333333;
            border: none;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            border: 1px solid #444444;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: #555555;
            transform: scale(1.02);
        }
        .copy-btn:active {
            transform: scale(0.96);
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #222222f0;
            backdrop-filter: blur(12px);
            padding: 14px 32px;
            border-radius: 60px;
            border: 1px solid #444444;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #qrPopup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-direction: column;
        }
        #qrPopup.show {
            display: flex;
        }
        #qrPopup .popup-inner {
            max-width: 95%;
            max-height: 85vh;
        }
        #qrPopup img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 30px;
            border: 3px solid #cccccc;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.3);
            background: #ffffff;
            padding: 15px;
            cursor: pointer;
        }
        #qrPopup .popup-hint {
            position: fixed;
            top: 25px;
            color: #aaaaaa;
            font-size: 0.9rem;
            letter-spacing: 2px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 28px;
            border-radius: 40px;
            border: 1px solid #444444;
            backdrop-filter: blur(4px);
        }
        #closePopupBtn {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(50,50,50,0.9);
            color: #ffffff;
            border: 1px solid #666666;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            z-index: 1001;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        #closePopupBtn:hover {
            background: rgba(80,80,80,0.9);
            border-color: #888888;
        }

        .floating-buttons {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        .tiktok-float {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #fff;
            text-decoration: none;
            font-size: 2.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: pulse-tiktok 2.5s infinite;
            position: relative;
        }
        .tiktok-float:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }
        .tiktok-float:active {
            transform: scale(0.94);
        }
        .tiktok-float svg {
            width: 36px;
            height: 36px;
        }
        @keyframes pulse-tiktok {
            0% {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            }
            50% {
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            }
            100% {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            }
        }
        .whatsapp-float {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #25d366;
            color: #fff;
            text-decoration: none;
            font-size: 2.4rem;
            box-shadow: 0 8px 30px rgba(37, 211, 102, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            animation: pulse-wa 2.2s infinite;
        }
        .whatsapp-float:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 40px rgba(37, 211, 102, 0.4);
        }
        .whatsapp-float:active {
            transform: scale(0.94);
        }
        .whatsapp-float svg {
            width: 38px;
            height: 38px;
        }
        @keyframes pulse-wa {
            0% {
                box-shadow: 0 8px 30px rgba(37, 211, 102, 0.25);
            }
            50% {
                box-shadow: 0 8px 40px rgba(37, 211, 102, 0.4);
            }
            100% {
                box-shadow: 0 8px 30px rgba(37, 211, 102, 0.25);
            }
        }
        .btn-label {
            position: absolute;
            right: 80px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateX(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .tiktok-float:hover .btn-label,
        .whatsapp-float:hover .btn-label {
            opacity: 1;
            transform: translateX(0);
        }
        @media(max-width:480px) {
            .payment-card {
                padding: 20px 16px 30px;
                border-radius: 32px;
            }
            .logo-circle {
                width: 80px;
                height: 80px;
            }
            .store-title {
                font-size: 1.8rem;
            }
            .account-number {
                font-size: 1.2rem;
            }
            .copy-btn {
                padding: 8px 14px;
                font-size: 0.85rem;
            }
            .kotak {
                padding: 18px 14px 18px;
            }
            .qr-wrapper img {
                max-width: 160px;
            }
            .account-row {
                padding: 12px 14px;
                border-radius: 40px;
            }
            #qrPopup .popup-inner {
                max-width: 98%;
            }
            #qrPopup img {
                max-height: 65vh;
                border-radius: 20px;
                padding: 10px;
            }
            #closePopupBtn {
                padding: 10px 25px;
                font-size: 0.85rem;
                bottom: 80px;
            }
            #qrPopup .popup-hint {
                top: 15px;
                font-size: 0.75rem;
                padding: 8px 18px;
            }
            .floating-buttons {
                bottom: 20px;
                right: 20px;
                gap: 12px;
            }
            .tiktok-float,
            .whatsapp-float {
                width: 58px;
                height: 58px;
            }
            .tiktok-float svg {
                width: 30px;
                height: 30px;
            }
            .whatsapp-float svg {
                width: 32px;
                height: 32px;
            }
            .btn-label {
                right: 68px;
                font-size: 0.65rem;
                padding: 4px 12px;
            }
            #intro-screen .intro-title {
                font-size: 2rem;
            }
        }
        @media(max-width:380px) {
            .account-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .copy-btn {
                justify-content: center;
            }
            .account-number {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="intro-title">WELCOME TO</div>
        <div class="intro-sub">PAYMENT HAIKAL RESELLER</div>
        <div class="loader"></div>
        <div class="loader-text">MEMUATKAN ...</div>
    </div>

    <canvas id="meteor-canvas"></canvas>

    <div id="qrPopup" onclick="closePopupOutside(event)">
        <span class="popup-hint">SS BUKTI TRX</span>
        <div class="popup-inner">
            <img id="popupQrImage" src="" alt="QR Code Full Screen HD" onclick="closePopup()">
        </div>
        <button id="closePopupBtn" onclick="closePopup()">✕ TUTUP</button>
    </div>

    <main class="payment-card" role="main">
        <div class="logo-container">
            <div class="logo-circle">
                <img src="https://files.catbox.moe/pt5e82.jpg" alt="HAIKAL RESELLER">
            </div>
        </div>

        <h1 class="store-title"><span>PAYMENT</span> HAIKAL <span>RESELLER</span></h1>

        <div class="kotak-grid">
            <div class="kotak" onclick="toggleKotak(this)">
                <div class="kotak-label">
                    <span class="icon-ewallet"></span> QR TOUCH N GO E-WALLET
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="kotak-content">
                    <div class="qr-wrapper">
                        <img src="https://files.catbox.moe/cgw54s.jpg" alt="QR Code Touch n Go E-Wallet HD" loading="lazy" onclick="event.stopPropagation();bukaPopup(this.src)">
                        <span class="qr-hint">Tekan Qr Untuk Papar Saiz Penuh</span>
                    </div>
                </div>
            </div>

            <div class="kotak" onclick="toggleKotak(this)">
                <div class="kotak-label">
                    <span class="icon-tng"></span> NOMBOR ACCOUNT TOUCH N GO
                    <span class="toggle-icon">▼</span>
                </div>
                <div class="kotak-content">
                    <div class="account-row">
                        <span class="account-number" id="tngAccount">151988800962</span>
                        <button class="copy-btn" onclick="event.stopPropagation();copyNumber('tngAccount')">SALIN</button>
                    </div>
                </div>
            </div>
    </main>

    <div class="floating-buttons">
        <a href="https://wa.me/60193440409" target="_blank" rel="noopener noreferrer" class="whatsapp-float" aria-label="WhatsApp">

            </svg>
            <span class="btn-label">WhatsApp</span>
        </a>
    </div>

    <div id="toast" class="toast-msg">✅ Nombor disalin!</div>

    <script>
        function toggleKotak(el) {
            el.classList.toggle('open');
        }

        function bukaPopup(src) {
            document.getElementById('popupQrImage').src = src;
            document.getElementById('qrPopup').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closePopup() {
            document.getElementById('qrPopup').classList.remove('show');
            document.body.style.overflow = '';
        }

        function closePopupOutside(e) {
            if (e.target === document.getElementById('qrPopup')) {
                closePopup();
            }
        }

        function copyNumber(id) {
            var span = document.getElementById(id);
            var text = span.textContent.trim();
            if (!text) {
                showToast('❌ Nombor tidak ditemui!');
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('✅ Nombor Disalin: ' + text);
                }).catch(function() {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
            document.body.appendChild(ta);
            ta.select();
            try {
                var ok = document.execCommand('copy');
                showToast(ok ? '✅ Nombor Disalin: ' + text : '❌ Gagal salin, sila manual.');
            } catch (_) {
                showToast('❌ Gagal salin, sila manual.');
            }
            document.body.removeChild(ta);
        }

        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        var intro = document.getElementById('intro-screen');
        setTimeout(function() {
            intro.classList.add('hidden');
            setTimeout(function() {
                intro.style.display = 'none';
            }, 400);
        }, 5000);

        var canvas = document.getElementById('meteor-canvas');
        var ctx = canvas.getContext('2d');
        var w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            drawBackground();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        var STAR_COUNT = 80;
        var stars = [];
        for (var i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random(),
                y: Math.random(),
                radius: 0.3 + Math.random() * 0.9,
                opacity: 0.1 + Math.random() * 0.3
            });
        }

        function drawBackground() {
            var grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.7);
            grad.addColorStop(0, '#f0f0f0');
            grad.addColorStop(1, '#d0d0d0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);
            for (var i = 0; i < stars.length; i++) {
                var s = stars[i];
                var x = s.x * w;
                var y = s.y * h;
                ctx.beginPath();
                ctx.arc(x, y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(100,100,100,' + s.opacity + ')';
                ctx.fill();
            }
        }

        var meteors = [];

        function createMeteor() {
            return {
                x: Math.random() * w * 0.9,
                y: Math.random() * h * 0.25,
                speed: 3 + Math.random() * 7,
                angle: Math.PI / 4 + (Math.random() * 0.3 - 0.15),
                length: 25 + Math.random() * 45,
                life: 0.4 + Math.random() * 0.6,
                maxLife: 0.4 + Math.random() * 0.6,
                width: 1 + Math.random() * 1.2
            };
        }

        for (var i = 0; i < 2; i++) {
            var m = createMeteor();
            m.x = Math.random() * w;
            m.y = Math.random() * h * 0.3;
            m.life = 0.2 + Math.random() * 0.3;
            meteors.push(m);
        }

        var lastTime = 0;

        function animateMeteor(t) {
            if (t - lastTime < 60) {
                requestAnimationFrame(animateMeteor);
                return;
            }
            lastTime = t;

            for (var i = meteors.length - 1; i >= 0; i--) {
                var m = meteors[i];
                m.x += Math.cos(m.angle) * m.speed;
                m.y += Math.sin(m.angle) * m.speed;
                m.life -= 0.01;
                if (m.life <= 0 || m.x > w + 50 || m.y > h + 50 || m.x < -50 || m.y < -50) {
                    meteors.splice(i, 1);
                }
            }

            if (Math.random() < 0.015 && meteors.length < 6) {
                meteors.push(createMeteor());
            }

            drawBackground();

            for (var i = 0; i < meteors.length; i++) {
                var m = meteors[i];
                var dx = Math.cos(m.angle) * m.length;
                var dy = Math.sin(m.angle) * m.length;
                var op = Math.min(1, (m.life / m.maxLife) * 1.2);

                var grad = ctx.createLinearGradient(m.x, m.y, m.x - dx, m.y - dy);
                grad.addColorStop(0, 'rgba(80,80,80,' + (op * 0.6) + ')');
                grad.addColorStop(0.5, 'rgba(60,60,60,' + (op * 0.35) + ')');
                grad.addColorStop(1, 'rgba(40,40,40,0)');

                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - dx, m.y - dy);
                ctx.strokeStyle = grad;
                ctx.lineWidth = m.width;
                ctx.shadowColor = 'rgba(80,80,80,' + (op * 0.1) + ')';
                ctx.shadowBlur = 8;
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(m.x, m.y, 1 + m.width * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(60,60,60,' + (op * 0.5) + ')';
                ctx.shadowColor = 'rgba(80,80,80,' + (op * 0.15) + ')';
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animateMeteor);
        }

        requestAnimationFrame(animateMeteor);

        document.onkeydown = function(e) {
            if (e.key === 'Escape') {
                var popup = document.getElementById('qrPopup');
                if (popup.classList.contains('show')) {
                    closePopup();
                }
            }
        };

        setTimeout(function() {
            showToast('Hai Selamat Datang!');
        }, 5500);
    </script>
